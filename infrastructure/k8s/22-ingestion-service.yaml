apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: chaos-stream
spec:
  selector:
    app: ingestion-service
  ports:
    - port: 5555
      targetPort: 5555
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: chaos-stream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
    spec:
      # See gateway-service's Deployment for why this matters — prevents Kubernetes from
      # auto-injecting Docker-links-style env vars that can collide with Spring placeholders.
      enableServiceLinks: false
      containers:
        - name: ingestion-service
          image: chaos-stream-ingestion-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5555
          env:
            - name: SERVER_PORT
              value: "5555"
            - name: INGESTION_SERVICE_PORT
              value: "5555"
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: chaos-stream-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: chaos-stream-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 5555
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 5555
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
